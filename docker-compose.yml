x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-envmon}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
  POSTGRES_DB: ${POSTGRES_DB:-envmon}

x-api-env: &api-env
  MQTT_HOST: mosquitto
  MQTT_PORT: 1883
  MQTT_USER: ${MQTT_USER:-station}
  MQTT_PASSWORD: ${MQTT_PASSWORD:?задайте MQTT_PASSWORD в .env}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-envmon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-envmon}
  JWT_SECRET: ${JWT_SECRET:?задайте JWT_SECRET в .env}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD в .env}
  DEVICE_ID: ${DEVICE_ID:-station-01}
  DEVICE_NAME: ${DEVICE_NAME:-Станция 1}
  DEVICE_TOKEN: ${DEVICE_TOKEN:?задайте DEVICE_TOKEN в .env}
  GEOCODE_ENABLED: ${GEOCODE_ENABLED:-true}
  LOCATION_RADIUS_M: ${LOCATION_RADIUS_M:-2000}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: [prod, dev]
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-envmon} -d ${POSTGRES_DB:-envmon}"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-dev-port:
    image: alpine/socat
    profiles: [dev]
    depends_on: [db]
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:db:5432
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    profiles: [prod, dev]
    command:
      - sh
      - -c
      - |
        rm -f /mosquitto/config/passwd
        mosquitto_passwd -b -c /mosquitto/config/passwd "$$MQTT_USER" "$$MQTT_PASSWORD"
        chown mosquitto:mosquitto /mosquitto/config/passwd
        chmod 0600 /mosquitto/config/passwd
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    environment:
      MQTT_USER: ${MQTT_USER:-station}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?задайте MQTT_PASSWORD в .env}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
    ports:
      - "${MQTT_PORT_EXPOSED:-1883}:1883"

  api:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    profiles: [prod]
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      <<: *api-env
      CORS_ORIGINS: ${CORS_ORIGINS:-}

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    profiles: [prod]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: [prod]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       
      - caddy_config:/config
    depends_on: [api, web]

  api-dev:
    build:
      context: ./backend
      target: dev
    profiles: [dev]
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      <<: *api-env
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    volumes:
      - ./backend/app:/app/app:ro
    ports:
      - "${API_PORT:-8000}:8000"

  web-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    profiles: [dev]
    depends_on: [api-dev]
    environment:
      API_PROXY: http://api-dev:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
      - ./frontend/svelte.config.js:/app/svelte.config.js
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  pgdata:
  mosquitto_data:
  caddy_data:
  caddy_config:
